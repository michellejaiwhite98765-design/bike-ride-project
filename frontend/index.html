<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0F17" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BikeRide — Share your journey</title>
  </head>
  <body>
    <!-- Boot splash: shown until React mounts and replaces #root's content.
         Same look as src/components/ui/BrandLoader.jsx. -->
    <style>
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(45,212,191,.12),transparent 55%),#0B0F17;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#94A3B8}
      #boot-splash .w{position:relative;width:88px;height:88px;display:grid;place-items:center}
      #boot-splash .r{position:absolute;inset:0;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,#2DD4BF,#8B5CF6,transparent 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:bs 1s linear infinite}
      #boot-splash .r2{inset:10px;padding:3px;opacity:.55;animation-duration:1.6s;animation-direction:reverse}
      #boot-splash svg{width:46%;fill:none;stroke:#2DD4BF;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      #boot-splash .b{font-size:20px;font-weight:800;background:linear-gradient(135deg,#2DD4BF,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
      #boot-splash .road{position:relative;width:120px;height:4px;border-radius:999px;background:rgba(148,163,184,.18);overflow:hidden}
      #boot-splash .road span{position:absolute;top:0;bottom:0;width:40%;border-radius:999px;background:linear-gradient(90deg,#2DD4BF,#8B5CF6);animation:bsr 1.2s ease-in-out infinite}
      @keyframes bs{to{transform:rotate(360deg)}}
      @keyframes bsr{0%{left:-40%}100%{left:100%}}
    </style>
    <div id="root">
      <div id="boot-splash" role="status">
        <div class="w">
          <span class="r"></span><span class="r r2"></span>
          <svg viewBox="0 0 64 40" aria-hidden="true"><circle cx="13" cy="27" r="9"/><circle cx="51" cy="27" r="9"/><path d="M13 27 L25 11 H37 L51 27 M25 11 L32 27 H13 M37 11 L41 5 H47 M32 27 L41 11"/></svg>
        </div>
        <div class="b">BikeRide</div>
        <div class="road"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
